<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Archito app-icoon">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="archTile"><rect x="0" y="0" width="140" height="140" rx="36"/></clipPath>
    <pattern id="archGrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <g transform="scale(3.657143)">
    <!-- full-bleed achtergrond (veilig voor maskable-hoeken) -->
    <rect x="0" y="0" width="140" height="140" rx="36" fill="url(#archBg)"/>

    <g clip-path="url(#archTile)">
      <rect x="0" y="0" width="140" height="140" fill="url(#archGrid)"/>

      <!-- ===== gele blokken-"A" (schuin -10°) ===== -->
      <g transform="rotate(-10 70 38)" fill="#facc15" stroke="#090d16" stroke-width="1.8">
        <rect x="65.5" y="20"   width="9" height="9" rx="2"/>
        <rect x="55"   y="30.5" width="9" height="9" rx="2"/>
        <rect x="76"   y="30.5" width="9" height="9" rx="2"/>
        <rect x="55"   y="41"   width="9" height="9" rx="2"/>
        <rect x="65.5" y="41"   width="9" height="9" rx="2"/>
        <rect x="76"   y="41"   width="9" height="9" rx="2"/>
        <rect x="55"   y="51.5" width="9" height="9" rx="2"/>
        <rect x="76"   y="51.5" width="9" height="9" rx="2"/>
      </g>

      <!-- ===== roze-rood hoofdblok ===== -->
      <rect x="21" y="72" width="98" height="56" rx="14" fill="#090d16"/>            <!-- harde schaduw -->
      <rect x="21" y="66" width="98" height="56" rx="14" fill="#f43f5e" stroke="#090d16" stroke-width="4"/>
      <!-- ogen -->
      <rect x="49" y="85" width="11" height="11" rx="4.5" fill="#090d16"/>
      <rect x="80" y="85" width="11" height="11" rx="4.5" fill="#090d16"/>
      <!-- scheve glimlach -->
      <path d="M58 105 Q70 114 82 105" fill="none" stroke="#090d16" stroke-width="4"
            stroke-linecap="round" transform="rotate(-10 70 108)"/>
    </g>

    <!-- neo-brutalist rand -->
    <rect x="3.5" y="3.5" width="133" height="133" rx="34" fill="none" stroke="#090d16" stroke-width="7"/>
  </g>
</svg>
